name: Compilar el mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el proyecto
        run: unzip -q *.zip -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilar
        working-directory: proyecto/civilizacion_nether
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: civilizacion_nether-jar
          path: proyecto/civilizacion_nether/build/libs/*.jar
